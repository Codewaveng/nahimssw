  <rect x="330" y="215" width="90" height="8" rx="4" fill="#0B6E4F" opacity="0.25"/>
  <rect x="330" y="235" width="120" height="8" rx="4" fill="#0B6E4F" opacity="0.25"/>
  <rect x="330" y="255" width="80" height="8" rx="4" fill="#0B6E4F" opacity="0.25"/>
